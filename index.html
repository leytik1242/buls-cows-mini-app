
<script>
(() => {
  const tg = window.Telegram?.WebApp;
  tg?.ready();
  tg?.expand();

  const SUPABASE_URL =
    "https://zszvdojmvillbhwyodzb.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_D5kH72S7FWe0DdhPbMcWrA_guF4w4no";

  const $ = (id) => document.getElementById(id);

  // Сохраняем исходную строку Telegram без преобразований.
  function getTelegramInitData() {
    return window.Telegram?.WebApp?.initData ?? "";
  }

  let secret = "";
  let count = 0;
  let finished = false;
  let history = [];

  function readStats() {
    try {
      return JSON.parse(localStorage.getItem("bc-stats")) ||
        { total: 0, wins: 0, record: null };
    } catch {
      return { total: 0, wins: 0, record: null };
    }
  }

  function saveStats(stats) {
    localStorage.setItem("bc-stats", JSON.stringify(stats));
  }

  function showScreen(id) {
    document.querySelectorAll(".screen").forEach((screen) =>
      screen.classList.remove("active")
    );

    const target = $(id);
    if (target) target.classList.add("active");
  }

  function goHome() {
    showScreen("home");
  }

  async function createRoom() {
    const initData = getTelegramInitData();

    if (!initData) {
      alert("Открой игру через Telegram, чтобы создать комнату.");
      return;
    }

    const button = document.querySelector(
      'button[onclick="window.createRoom()"]'
    );

    if (button) button.disabled = true;

    try {
      console.log("Создание комнаты: initData получен", {
        present: true,
        length: initData.length,
      });

      const response = await fetch(
        `${SUPABASE_URL}/functions/v1/create-room`,
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_PUBLISHABLE_KEY,
          },
          body: JSON.stringify({ initData }),
        }
      );

      const result = await response.json();

      if (!response.ok) {
        console.error("Ошибка create-room:", {
          status: response.status,
          error: result.error,
        });

        throw new Error(
          result.error || `Ошибка сервера: ${response.status}`
        );
      }

      alert(
        "Комната создана!\nКод для друга: " + result.roomCode
      );

      console.log("Комната успешно создана", {
        roomCode: result.roomCode,
        status: result.status,
      });
    } catch (error) {
      console.error(
        "Ошибка создания комнаты:",
        error instanceof Error ? error.message : "Неизвестная ошибка"
      );

      alert(
        error instanceof Error
          ? error.message
          : "Не удалось подключиться к серверу."
      );
    } finally {
      if (button) button.disabled = false;
    }
  }

  function showJoinRoom() {
    alert("Вход в комнату пока не подключён к серверу.");
  }

  function newGame() {
    secret = "";

    while (secret.length < 4) {
      const digit = String(Math.floor(Math.random() * 9) + 1);
      if (!secret.includes(digit)) secret += digit;
    }

    count = 0;
    finished = false;
    history = [];

    $("attempts").textContent = "0";
    $("message").textContent = "Жду твою первую попытку!";
    $("history").innerHTML =
      '<div class="section-sub">Тут появятся твои ходы</div>';
    $("guess").value = "";
    $("guess").disabled = false;
    $("digits").innerHTML = [1, 2, 3, 4]
      .map(() => '<div class="digit">?</div>')
      .join("");
    $("best").textContent = readStats().record ?? "—";

    showScreen("game");
    $("guess").focus();
  }

  function showStats() {
    const stats = readStats();

    $("total").textContent = stats.total;
    $("wins").textContent = stats.wins;
    $("rate").textContent = stats.total
      ? Math.round(stats.wins / stats.total * 100) + "%"
      : "0%";
    $("record").textContent = stats.record ?? "—";

    showScreen("statsScreen");
  }

  function showRules() {
    showScreen("rules");
  }

  $("guessForm").addEventListener("submit", (event) => {
    event.preventDefault();
    if (finished) return;

    const guess = $("guess").value.trim();

    if (!/^[1-9]{4}$/.test(guess) || new Set(guess).size !== 4) {
      $("message").textContent =
        "Введи 4 разные цифры от 1 до 9, например 1572.";
      return;
    }

    count++;

    let bulls = 0;
    let cows = 0;

    for (let i = 0; i < 4; i++) {
      if (guess[i] === secret[i]) {
        bulls++;
      } else if (secret.includes(guess[i])) {
        cows++;
      }
    }

    history.unshift({ guess, bulls, cows });

    $("attempts").textContent = count;
    $("digits").innerHTML = guess.split("")
      .map((digit) => `<div class="digit">${digit}</div>`)
      .join("");

    $("history").innerHTML = history.map((move, i) =>
      `<div class="move">
        <span>${history.length - i}. <b>${move.guess}</b></span>
        <span>🐂 ${move.bulls} &nbsp; 🐄 ${move.cows}</span>
      </div>`
    ).join("");

    if (bulls === 4) {
      finished = true;
      $("message").textContent =
        `🏆 Победа! Ты угадал за ${count} попыток!`;
      $("guess").disabled = true;

      const stats = readStats();
      stats.total++;
      stats.wins++;

      if (stats.record === null || count < stats.record) {
        stats.record = count;
      }

      saveStats(stats);
      $("best").textContent = stats.record;

      tg?.HapticFeedback?.notificationOccurred("success");

      const button = document.createElement("button");
      button.className = "primary";
      button.textContent = "🔄 Играть ещё";
      button.onclick = newGame;
      $("history").prepend(button);
    } else {
      $("message").textContent =
        `🐂 ${bulls} быка · 🐄 ${cows} коровы`;
      tg?.HapticFeedback?.selectionChanged();
    }

    $("guess").value = "";
  });

  // Функции доступны для существующих onclick в HTML.
  window.createRoom = createRoom;
  window.newGame = newGame;
  window.showStats = showStats;
  window.showRules = showRules;
  window.showJoinRoom = showJoinRoom;
  window.goHome = goHome;
  window.showScreen = showScreen;

  console.log("Mini App запущен", {
    telegramAvailable: Boolean(tg),
    initDataPresent: Boolean(getTelegramInitData()),
  });
})();
</script>
